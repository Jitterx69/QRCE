[project]
name = "qrce"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "matplotlib",
  "pydantic",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "quantum/tests", "control/tests", "runtime/tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"


